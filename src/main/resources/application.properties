spring.application.name=SistemaDeBiblioteca

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Administrador inicial (solo se crea si no hay usuarios y se define la contraseña)
biblioteca.admin.nombre=${ADMIN_NOMBRE:admin}
biblioteca.admin.password=${ADMIN_PASSWORD:}

# Plazo de retención inicial; después lo cambia el administrador en PUT /configuracion/editar
biblioteca.reserva.dias-retencion=${DIAS_RETENCION:3}
